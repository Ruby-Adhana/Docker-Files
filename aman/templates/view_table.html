<!DOCTYPE html>
<html>
<head>
    <title>View Table</title>
</head>
<body>
    <h2>Data in {{ db }}.{{ table }}</h2>
    {% if rows %}
    <table border="1" cellpadding="5">
        <tr>
            {% for col in rows[0].keys() %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>
        {% for row in rows %}
        <tr>
            {% for value in row.values() %}
            <td>{{ value }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No data found.</p>
    {% endif %}
    <br>
    <a href="/">Back</a>
</body>
</html>

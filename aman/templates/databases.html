<!DOCTYPE html>
<html>
<head>
    <title>All Databases</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #333; }
        ul { padding: 0; }
        li { list-style: none; margin: 8px 0; }
        a { text-decoration: none; color: #007BFF; }
        a:hover { text-decoration: underline; }
        form { margin-top: 20px; }
        input[type="text"] {
            padding: 6px;
            font-size: 16px;
            width: 200px;
        }
        button {
            padding: 6px 12px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <h1>All Databases</h1>
    <ul>
        {% for db in databases %}
            <li><a href="{{ url_for('show_tables', dbname=db) }}">{{ db }}</a></li>
        {% endfor %}
    </ul>

    <h2>Create New Database</h2>
    <form action="/create_db" method="post">
        <input type="text" name="dbname" placeholder="Database name" required>
        <button type="submit">Create</button>
    </form>
</body>
</html>
